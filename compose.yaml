services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [frontend]
    depends_on:
      - api
  
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: boardgames
      POSTGRES_USER: boardgames
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgames -d boardgames"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=boardgames;Username=boardgames;Password=${DB_PASSWORD}"
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy

networks:
  frontend:
  backend:

volumes:
  pgdata: